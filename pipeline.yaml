Resources:
  CodePipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: LambdaDeploymentPipeline
      RoleArn: arn:aws:iam::YOUR_ACCOUNT_ID:role/CodePipelineRole
      ArtifactStore:
        Type: S3
        Location: YOUR_S3_BUCKET_NAME
      Stages:
        - Name: Source
          Actions:
            - Name: Source
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeCommit
                Version: 1
              OutputArtifacts:
                - Name: SourceArtifact
              Configuration:
                RepositoryName: YOUR_REPO_NAME
                BranchName: main
        - Name: Build
          Actions:
            - Name: Build
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: 1
              InputArtifacts:
                - Name: SourceArtifact
              OutputArtifacts:
                - Name: BuildArtifact
              Configuration:
                ProjectName: YOUR_CODEBUILD_PROJECT_NAME
        - Name: Deploy
          Actions:
            - Name: Deploy
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: Lambda
                Version: 1
              InputArtifacts:
                - Name: BuildArtifact
              Configuration:
                FunctionName: YOUR_LAMBDA_FUNCTION_NAME