name: Update Versions JSON

on:
  push:
    branches:
      - main

jobs:
  update-versions:
    runs-on: ubuntu-latest

    steps:
       # Step 1: Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      # Step 2: Install jq (for JSON manipulation)
      - name: Install jq (for JSON manipulation)
        run: sudo apt-get install -y jq
      
      # Step 3: Inspect the GitHub event payload
      - name: Inspect GitHub event payload
        run: |
          echo "GitHub event payload:"
          echo "${{ toJson(github.event) }}" 

      # Step 4: Parse the GitHub event payload
      - name: Extract changed directories
        id: extract_dirs
        run: |
          echo "Extracting changed directories from GitHub payload..."
          echo "${{ toJson(github.event.commits) }}" | jq -r '.[].modified[]' > changed_files.txt
          cat changed_files.txt | awk -F'/' '{print $1}' | sort -u > changed_dirs.txt
          echo "CHANGED_DIRS=$(cat changed_dirs.txt)" >> $GITHUB_ENV
          cat changed_dirs.txt

