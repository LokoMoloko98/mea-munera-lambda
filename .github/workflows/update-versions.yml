name: Update Versions JSON

on:
  push:
    branches:
      - main

jobs:
  update-versions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install jq (for JSON manipulation)
        run: sudo apt-get install -y jq

      - name: Detect Changed Directories
        id: detect_changes
        run: |
          # Find directories with changes
          CHANGED_DIRS=$(git diff --name-only HEAD~1 HEAD | awk -F'/' '{print $1}' | sort -u)
          echo "Changed directories: $CHANGED_DIRS"
          echo "::set-output name=changed_dirs::$CHANGED_DIRS"

      - name: Update Versions JSON
        run: |
          CHANGED_DIRS="${{ steps.detect_changes.outputs.changed_dirs }}"
          echo "Changed directories: $CHANGED_DIRS"

          # Load the existing versions.json
          jq '.' versions.json > current_versions.json

          # Update versions for changed directories
          echo "$CHANGED_DIRS" | tr ' ' '\n' | while read DIR; do
            echo "Updating version for $DIR"
            CURRENT_VERSION=$(jq -r --arg dir "$DIR" '.[$dir]' current_versions.json)
            
            if [[ "$CURRENT_VERSION" != "null" ]]; then
              # Increment version
              IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
              PATCH=$((PATCH + 1))
              NEW_VERSION="$MAJOR.$MINOR.$PATCH"
            else
              # Set initial version
              NEW_VERSION="1.0.0"
            fi
            
            # Update version in JSON
            jq --arg dir "$DIR" --arg new_version "$NEW_VERSION" '.[$dir] = $new_version' current_versions.json > tmp.json && mv tmp.json current_versions.json
          done

          # Save updated versions.json
          mv current_versions.json versions.json

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add versions.json
          git commit -m "Automated version bump for changed directories"
          git push