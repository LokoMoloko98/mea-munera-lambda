name: Update Versions JSON

on:
  push:
    branches:
      - main

jobs:
  update-versions:
    runs-on: ubuntu-latest

    steps:
       # Step 1: Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      # Step 2: Install jq (for JSON manipulation)
      - name: Install jq (for JSON manipulation)
        run: sudo apt-get install -y jq

      # Step 2: Inspect the GitHub event payload
      - name: Inspect GitHub event payload
        run: |
          echo "GitHub event payload:"
          echo "${{ toJson(github.event) }}" 

      # Step 3: Extract changed directories from modified, added, and removed files
      - name: Extract changed directories
        id: extract_dirs
        run: |
          # Set the repository and commit information from the event payload
          REPO_OWNER="LokoMoloko98"
          REPO_NAME="mea-munera-lambda"
          TREE_SHA="${{ github.event.head_commit.tree_id }}"
          GITHUB_API_URL="https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/git/trees/${TREE_SHA}?recursive=true"

          # Fetch the tree structure from GitHub
          RESPONSE=$(curl -s "$GITHUB_API_URL")

          # Extract directories (paths) from the tree
          DIRECTORIES=$(echo "$RESPONSE" | jq -r '.tree[] | select(.type == "tree") | .path')
          
          # Output the directories
          echo "Changed Directories:"
          echo "$DIRECTORIES"

       # Step 4: Update versions.json
      - name: Update versions.json
        id: update_versions
        run: |
          echo "Updating versions.json..."
          if [ ! -f versions.json ]; then
            echo "{}" > versions.json
          fi
          cp versions.json versions_old.json
          while IFS= read -r dir; do
            if jq -e ".\"$dir\"" versions.json > /dev/null; then
              jq ".\"$dir\" += 1" versions.json > tmp.json && mv tmp.json versions.json
            else
              jq ".\"$dir\" = 1" versions.json > tmp.json && mv tmp.json versions.json
            fi
          done < changed_dirs.txt
          echo "Updated versions.json:"
          cat versions.json

      # Step 4: Commit and push the changes
      - name: Commit and push changes
        if: success()
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add versions.json
          git commit -m "Automated version bump for changed directories"
          git push