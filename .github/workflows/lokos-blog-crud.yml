name: Track Changes in lokos-blog-crud

on:
  push:
    branches:
      - main
    paths:
      - 'lokos-blog-crud/**' # Run only if changes are in lokos-blog-crud directory

jobs:
  log-changes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Log Changes for lokos-blog-crud
        run: |
          # Handle cases where there might not be a previous commit
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            echo "Changes detected in lokos-blog-crud:" >> lokos-blog-crud/log.txt
            git diff --name-only HEAD^ HEAD -- lokos-blog-crud/ >> lokos-blog-crud/log.txt
          else
            echo "No previous commit. Assuming initial changes in lokos-blog-crud:" >> lokos-blog-crud/log.txt
             git diff --name-only HEAD^ HEAD -- lokos-blog-crud/ >> lokos-blog-crud/log.txt
          fi
          git config --global user.name "LokoBot"
          git config --global user.email "molavovic@gmail.com"
          git add lokos-blog-crud/log.txt
          git commit -m "Log changes in lokos-blog-crud"
          git push