version: 0.2

phases:
  install:
    commands:
      - echo "Installing prerequisites..."
      - apt-get update && apt-get install -y zip  # Ensure 'zip' is installed
  pre_build:
    commands:
      - echo "Detecting changes in the repository..."
      # - export CHANGED_DIRS=$(git diff-tree --no-commit-id --name-only -r $CODEBUILD_RESOLVED_SOURCE_VERSION | awk -F'/' '{print $1}' | sort -u | uniq)
      - export CHANGED_DIRS=$(git diff --name-only HEAD~1 HEAD | awk -F'/' '{print $1}' | sort -u | uniq)
      - if [ -z "$CHANGED_DIRS" ]; then echo "No changes detected, exiting build." exit 0; fi
      - echo "Changed directories:"
      - echo "$CHANGED_DIRS"
      - echo "Creating JSON file for changed directories..."
      - jq -n --slurpfile dirs /tmp/changed_dirs.txt '{"changed_dirs": $dirs | unique}' > changed_dirs.json
  post_build:
    commands:
      - echo "Uploading metadata file to S3..."
      - aws s3 cp changed_dirs.json s3://$SHARED_ARTIFACTS_BUCKET/lambda/changed_dirs.json

artifacts:
  files:
    - lambda/**/*.zip
    - changed_dirs.json
