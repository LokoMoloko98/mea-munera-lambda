version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - pip install --upgrade pip
  pre_build:
    commands:
      - echo Installing dependencies...
      - pip install -r requirements.txt -t .
  build:
    commands:
      - echo Packaging Lambda function...
      - zip -r function.zip .
  post_build:
    commands:
      - echo Uploading package to S3...
      - aws s3 cp function.zip
        s3://your-s3-bucket-name/path/to/lambda_function_1/
artifacts:
  files:
    - function.zip