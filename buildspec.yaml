version: 0.2

phases:
  install:
    commands:
      - echo "Installing prerequisites..."
      - apt-get update && apt-get install -y zip  # Ensure 'zip' is installed
  pre_build:
    commands:
      - echo "Detecting changes in the repository..."
      - |
        export CHANGED_DIRS=$(git diff-tree --no-commit-id --name-only -r $CODEBUILD_RESOLVED_SOURCE_VERSION | awk -F'/' '{print $1}' | sort -u | uniq)
      - |
        if [ -z "$CHANGED_DIRS" ]; then
          echo "No changes detected, exiting build."
          exit 0
        fi
      - echo "Changed directories: $CHANGED_DIRS"
  build:
    commands:
      - |
        for DIR in $CHANGED_DIRS; do
          if [ -d "$DIR" ]; then
            echo "Processing $DIR..."
            cd $DIR
            pip install -r requirements.txt -t .
            zip -r function.zip .
            version=$(date +%Y%m%d%H%M%S)
            aws s3 cp function.zip s3://$SHARED_ARTIFACTS_BUCKET/lambda/$DIR/function-$version.zip
            cd ..
          else
            echo "$DIR is not a valid directory, skipping..."
          fi
        done
  post_build:
    commands:
      - echo "Build phase completed. Artifacts uploaded to S3."
